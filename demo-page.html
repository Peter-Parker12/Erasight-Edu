<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trang Mẫu Thử Nghiệm Tái Sử Dụng Header & Footer — Erasight</title>
  
  <link rel="icon" type="image/png" href="assets/logos/erasight-bieutuong-mau-1024w.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="assets/css/style.css?v=2.1" />
  <link rel="stylesheet" href="assets/css/header-footer.css?v=2.2" />
</head>
<body>

  <!-- ======================================================================
       HEADER ĐƯỢC NẠP TỰ ĐỘNG QUA ID 'site-header'
       ====================================================================== -->
  <div id="site-header"></div>

  <!-- NỘI DUNG RIÊNG CỦA TRANG NÀY -->
  <main style="padding: 80px 0; min-height: 60vh; background: #FAFCFC;">
    <div class="wrap" style="max-width: 900px; text-align: center;">
      <span class="eyebrow" style="margin: 0 auto 16px;">Demo Tái Sử Dụng Thành Công</span>
      <h1 style="font-size: 38px; margin-bottom: 20px; line-height: 1.25;">
        Trang mới này chỉ cần đúng 2 dòng placeholder<br />
        <span style="color: var(--p);">Header & Footer tự động nạp 100%!</span>
      </h1>
      <p style="font-size: 17px; color: var(--slate); max-width: 680px; margin: 0 auto 36px; line-height: 1.7;">
        Bạn không cần copy-paste hay bảo trì code trùng lặp ở nhiều trang. Mọi thay đổi ở thanh menu, liên kết, số hotline hay logo chỉ cần chỉnh 1 nơi duy nhất.
      </p>

      <div style="display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
        <a href="index.html" class="btn btn-primary" style="padding: 12px 28px; border-radius: 8px;">&larr; Về Trang Chủ</a>
        <a href="#dang-nhap" class="btn btn-ghost" style="padding: 12px 28px; border-radius: 8px;">Thử Bấm Đăng Nhập</a>
      </div>
    </div>
  </main>

  <!-- ======================================================================
       FOOTER ĐƯỢC NẠP TỰ ĐỘNG QUA ID 'site-footer'
       ====================================================================== -->
  <div id="site-footer"></div>

  <!-- Nạp bộ component điều khiển -->
  <script src="assets/js/components.js"></script>
</body>
</html>
