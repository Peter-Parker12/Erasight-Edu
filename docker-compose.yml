services:
  erasight-edu:
    build: .
    container_name: erasight-edu
    restart: unless-stopped
    ports:
      - "4232:4232"
    env_file:
      - .env
    environment:
      TWENTY_URL: ${TWENTY_URL}
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      WP_API_URL: ${WP_API_URL}
      WP_POST_TAG: ${WP_POST_TAG:-erasight-education}
      SITE_URL: ${SITE_URL:-https://academy.erasight.net}
      GTM_ID: ${GTM_ID:-}
      # AI document library (see .env.example)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      WORKFLOW_API_KEY: ${WORKFLOW_API_KEY:-}
      MAIL_BATCH_MAX: ${MAIL_BATCH_MAX:-50}
      INTERNAL_COPY_EMAILS: ${INTERNAL_COPY_EMAILS:-}
      MAIL_REQUIRE_CONFIRM: ${MAIL_REQUIRE_CONFIRM:-0}
      MAIL_CLAIM_TTL_MIN: ${MAIL_CLAIM_TTL_MIN:-30}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-3}
      MCP_TOKEN: ${MCP_TOKEN:-}
      ACCESS_DAYS: ${ACCESS_DAYS:-7}
      MAX_DOC_MB: ${MAX_DOC_MB:-25}
      MAX_COVER_MB: ${MAX_COVER_MB:-3}
    volumes:
      - erasight-data:/app/data

volumes:
  erasight-data:
